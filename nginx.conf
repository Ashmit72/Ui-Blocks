server {
    listen 80;
    server_name dev.radianos.com;
    return 301 https://$host$request_uri;  # Redirect HTTP to HTTPS
}

server {
    listen 443 ssl;
    server_name dev.radianos.com;

    ssl_certificate /etc/ssl/certs/certificate.crt;  # Path to SSL certificate
    ssl_certificate_key /etc/ssl/private/private.key;  # Path to SSL key

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}